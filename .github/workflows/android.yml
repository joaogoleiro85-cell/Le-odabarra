
name: Gerar APK Leao da Barra

on:
  workflow_dispatch:
  push:
    paths:
      - 'LeaoDaBarraAndroid.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: unzip -q LeaoDaBarraAndroid.zip -d .

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p LeaoDaBarraAndroid :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LeaoDaBarra-APK
          path: LeaoDaBarraAndroid/app/build/outputs/apk/debug/app-debug.apk
          
